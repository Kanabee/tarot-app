<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ดูดวงไพ่ทาโรต์: หน้าเว็บของเซิร์ฟเวอร์ (เรียก API ที่ /api/*) -->
<title>ดูดวงไพ่ทาโรต์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap">
<style>
  /* ผังการออกแบบ: โทนเขียวเข้มสงบ ไพ่เป็นจุดเด่นตรงกลาง ตัวอักษรเรียบ อ่านง่าย */
  :root {
    --bg: #0d2820;
    --panel: #15382d;
    --panel-2: #1d4a3c;
    --line: rgba(190, 240, 215, .14);
    --fg: #eef8f3;
    --muted: #9cc9b5;
    --accent: #7fd6ae;
    --accent-ink: #082018;
    --gold: #e6c574;
    --danger: #ffc2b6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Prompt', 'Noto Sans JP', 'Sarabun', system-ui, sans-serif;
    font-size: 15px; line-height: 1.7;
    background: var(--bg); color: var(--fg);
    min-height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 440px; margin: 0 auto; min-width: 0; }
  h1 { font-size: 20px; font-weight: 500; text-align: center; text-wrap: balance; padding: 6px 0 10px; }
  h2 { font-size: 16px; font-weight: 500; margin-bottom: 10px; text-wrap: balance; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }

  .lang { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .lang .btn { padding: 6px 14px; font-size: 13px; }
  .btn {
    font-family: inherit; font-size: 15px; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 12px 20px; cursor: pointer;
  }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border: none; font-weight: 500; width: 100%; }
  .btn.ghost { background: transparent; }
  .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  input, textarea {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
  }
  textarea { min-height: 88px; resize: vertical; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line);
    font-family: inherit; font-size: 14px; cursor: pointer; color: var(--muted);
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; text-align: center; min-width: 0; }
  .stat .n { font-size: 20px; color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .tabs .btn { padding: 10px 6px; font-size: 14px; }
  .tabs .btn[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border: none; font-weight: 500; }
  .hero { position: relative; border-radius: 22px; padding: 18px 16px 14px; margin-bottom: 14px; border: 1.5px solid var(--gold); background: radial-gradient(120% 90% at 100% 0%, rgba(230,197,116,.16), transparent 55%), linear-gradient(160deg, var(--panel), #08201a); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .hero-top { display: flex; align-items: center; gap: 14px; }
  .hero-top > div:last-child { max-width: 150px; }
  .fox { position: absolute; right: 8px; top: 4px; width: 124px; pointer-events: none; filter: drop-shadow(0 0 8px rgba(230,197,116,.35)); }
  .fox { width: 102px; }
  .fox img { display: block; width: 100%; height: auto; animation: float 5.5s ease-in-out infinite; }
  .fox .spark { transform-origin: center; transform-box: fill-box; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); filter: drop-shadow(0 0 6px rgba(230,197,116,.35)); } 50% { transform: translateY(-3px) rotate(.6deg); filter: drop-shadow(0 0 12px rgba(230,197,116,.6)); } }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .fox img, .fox .spark { animation: none; } }
  .avatar { width: 84px; height: 84px; flex: 0 0 auto; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 0 4px rgba(230,197,116,.15); background: rgba(127,214,174,.08); display: grid; place-items: center; overflow: hidden; cursor: pointer; color: var(--gold); font-size: 34px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .hero-name { font-size: 20px; font-weight: 600; color: var(--fg); overflow-wrap: anywhere; }
  .hero-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .hero-stats { display: flex; justify-content: space-around; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(230,197,116,.35); text-align: center; }
  .hero-stats > div { flex: 1; }
  .hero-stats b { display: block; font-size: 24px; font-weight: 600; color: var(--gold); }
  .hero-stats span { font-size: 12px; color: var(--muted); }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .cats .btn { padding: 12px 8px; }
  .cats .btn[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border: none; font-weight: 500; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .cards.five { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .slot {
    aspect-ratio: 3 / 4.6; border-radius: 14px; border: 1.5px dashed var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; color: var(--muted); padding: 6px; text-align: center; overflow: hidden; min-width: 0;
  }
  .slot.back {
    background: linear-gradient(160deg, #2b7a5c, #0d2820); border: 1.5px solid var(--accent);
    color: #c9f2dc; font-size: 26px; cursor: pointer; font-family: inherit;
  }
  .slot.open { border: 1.5px solid var(--gold); background: rgba(230,197,116,.08); color: var(--fg); }
  .slot.open .nm { font-size: 11px; margin-top: 4px; color: var(--gold); line-height: 1.3; overflow-wrap: anywhere; }
  .slot.open.rev > .face { transform: rotate(180deg); }
  .face { font-size: 22px; }

  .result { white-space: pre-line; line-height: 1.85; font-size: 15px; }
  .lock { margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--bg); border: 1px dashed var(--accent); text-align: center; }
  .crisis { background: #3a221d; border: 1px solid #7a4a3f; color: var(--danger); white-space: pre-line; line-height: 1.85; border-radius: 16px; padding: 16px; }
  .disclaimer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }

  .hist { padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .hist:last-child { border-bottom: none; }
  .hist .t { font-size: 14px; }
  .hist .d { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .hist .result { margin-top: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
    padding: 12px 18px; border-radius: 14px; font-size: 14px; max-width: 90%;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20;
  }
  .toast.show { opacity: 1; }
  .sample-note { font-size: 12px; color: var(--gold); text-align: center; margin-bottom: 12px; }
  .slot.back, .btn, .chip { transition: transform .15s, opacity .15s; }
  .slot.back:active, .btn:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .35s ease both; }
  #dailySlot { width: 150px; margin: 12px auto 0; }
  #dailySlot > * { width: 100%; }
  #dailyText { text-align: center; }
</style>
</head>
<body>

<div id="app">
  <div class="lang" role="group" aria-label="Language">
    <button class="btn" data-lang="th">ไทย</button>
    <button class="btn" data-lang="ja">日本語</button>
    <button class="btn" data-lang="en">English</button>
  </div>
  <h1 data-i18n="appTitle"></h1>
  <p class="sample-note" data-i18n="sampleNote"></p>

  <!-- เข้าสู่ระบบ -->
  <section id="viewLogin" class="card" hidden>
    <h2 data-i18n="loginTitle"></h2>
    <p class="muted" style="margin-bottom:12px" data-i18n="loginHint"></p>
    <label for="loginName" class="muted">ชื่อผู้ใช้</label>
    <input id="loginName" autocomplete="username" placeholder="demo">
    <label for="loginPass" class="muted" style="margin-top:10px;display:block">รหัสผ่าน</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <p class="muted" id="loginError" style="color:#e89a8a;min-height:1.2em;margin:8px 0 0" aria-live="polite"></p>
    <button class="btn primary" id="loginBtn" data-i18n="loginBtn"></button>
  </section>

  <!-- หน้าหลัก -->
  <section id="viewMain" hidden>
    <div class="hero">
      <div class="fox" id="fox" aria-hidden="true"></div>
      <div class="hero-top">
        <div class="avatar" id="avatarBtn" role="button" tabindex="0">
          <img id="avatarImg" alt="" hidden>
          <span id="avatarPlus">+</span>
        </div>
        <div style="min-width:0">
          <div class="hero-name" id="heroName"></div>
          <div class="hero-sub" id="heroSub"></div>
        </div>
      </div>
      <input type="file" id="avatarFile" accept="image/*" hidden>
      <div class="hero-stats">
        <div hidden><b id="stCoins">0</b><span data-i18n="coinsLabel"></span></div>
        <div><b id="stReads">0</b><span data-i18n="statReads"></span></div>
        <div><b id="stDaily">0</b><span data-i18n="statDaily"></span></div>
        <div><b id="stMember">-</b><span data-i18n="statusLabel"></span></div>
      </div>
    </div>

    <div class="cats" role="tablist">
      <button class="btn" role="tab" data-cat="daily" aria-selected="true" data-i18n="catDaily"></button>
      <button class="btn" role="tab" data-cat="qa" aria-selected="false" data-i18n="catQa"></button>
    </div>

    <!-- หมวดไพ่ประจำวัน -->
    <section id="catDaily">
      <div class="card" id="dailyCard">
        <h2 data-i18n="dailyTitle"></h2>
        <p class="muted" id="dailyDate"></p>
        <div id="dailySlot"></div>
      </div>
      <div class="card" id="dailyResult">
        <p class="result" id="dailyText"></p>
      </div>
    </section>

    <!-- หมวดถามตอบ -->
    <section id="catQa" hidden>
    <div class="tabs" role="tablist">
      <button class="btn" role="tab" data-tab="read" aria-selected="true" data-i18n="tabRead"></button>
      <button class="btn" role="tab" data-tab="hist" aria-selected="false" data-i18n="tabHist"></button>
      <button class="btn" role="tab" data-tab="acc" aria-selected="false" data-i18n="tabAcc"></button>
    </div>

    <!-- เปิดไพ่ -->
    <section id="tabRead">
      <div class="card">
        <h2 data-i18n="topicTitle"></h2>
        <div class="chips" id="topicChips"></div>
        <h2 data-i18n="questionTitle"></h2>
        <label for="question" class="muted" data-i18n="questionHint"></label>
        <textarea id="question" data-i18nph="questionPh"></textarea>
        <h2 data-i18n="countTitle"></h2>
        <div class="chips" id="countChips">
          <button class="chip" data-n="3" aria-pressed="true" data-i18n="count3"></button>
          <button class="chip" data-n="5" aria-pressed="false" data-i18n="count5"></button>
        </div>
        <button class="btn primary" id="startBtn" data-i18n="startBtn"></button>
      </div>

      <div class="card" id="drawCard" hidden>
        <h2 data-i18n="drawTitle"></h2>
        <div class="cards" id="deckRow"></div>
        <p class="muted" id="drawHint" style="text-align:center"></p>
      </div>

      <div class="card" id="resultCard" hidden>
        <h2 data-i18n="resultTitle"></h2>
        <div class="cards" id="resultCards"></div>
        <div class="result" id="resultText"></div>
        <div class="lock" id="followBox" hidden>
          <p class="muted" style="margin-bottom:10px" data-i18n="followAsk"></p>
          <button class="btn primary" id="followYes" data-i18n="followYes"></button>
          <button class="btn" id="followNo" style="margin-top:8px;width:100%" data-i18n="followNo"></button>
        </div>
        <div class="lock" id="lockBox" hidden></div>
        <div class="crisis" id="crisisBox" hidden></div>
        <button class="btn primary" id="newBtn" style="margin-top:14px" data-i18n="newBtn"></button>
      </div>
    </section>

    <!-- ประวัติ -->
    <section id="tabHist" hidden>
      <div class="card"><h2 data-i18n="histTitle"></h2><div id="histList"></div></div>
    </section>

    <!-- บัญชี -->
    <section id="tabAcc" hidden>
      <div class="card">
        <h2 id="accName"></h2>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:12px">
          <button class="btn" id="grantBtn" data-i18n="grantBtn" hidden></button>
          <button class="btn" id="memberBtn"></button>
          <button class="btn ghost" id="logoutBtn" data-i18n="logoutBtn"></button>
        </div>
        <p class="disclaimer" data-i18n="disclaimer"></p>
      </div>
    </section>
    </section>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COINS_ENABLED = false; // ซ่อนระบบเหรียญไว้ก่อน ทุกคนอ่านคำตอบเต็มได้

  // ---------- ข้อความและข้อมูลไพ่ทั้งสามภาษา ----------
  const L = {
    th: {
      ui: {
        appTitle: "ดูดวงไพ่ทาโรต์",
        sampleNote: "เวอร์ชันทดลอง ข้อมูลเก็บที่เซิร์ฟเวอร์ของแอป",
        loginTitle: "เข้าสู่ระบบ", loginHint: "ตัวอย่างนี้ใช้ชื่อแทนการล็อกอินด้วย Google หรือ LINE",
        loginName: "ชื่อที่ต้องการให้แสดง", namePh: "เช่น มีนา", loginBtn: "เข้าสู่ระบบ",
        trialLabel: "ทดลองฟรีเหลือ", coinsLabel: "เหรียญ", statusLabel: "สถานะ",
        catDaily: "ไพ่ประจำวัน", catQa: "ถามตอบ", statReads: "ครั้งที่เปิดไพ่", statDaily: "วันที่ดูไพ่ประจำวัน", avatarLabel: "เพิ่มรูปโปรไฟล์", tabRead: "เปิดไพ่", tabHist: "ประวัติ", tabAcc: "บัญชี",
        topicTitle: "หัวข้อที่อยากรู้", questionTitle: "หรือตั้งคำถามเอง",
        questionHint: "พิมพ์สิ่งที่อยากรู้ให้ชัดเจนได้ยิ่งดี",
        questionPh: "เช่น ควรย้ายงานดีไหม หรือ ความสัมพันธ์นี้จะไปต่อได้ไหม",
        countTitle: "จำนวนใบ", count3: "3 ใบ", count5: "5 ใบ", startBtn: "เริ่มดูดวง",
        drawTitle: "ตั้งจิตอธิษฐาน แล้วแตะไพ่ที่ดึงดูดใจคุณ",

        reading: "กำลังอ่านไพ่...",
        resultTitle: "คำตอบจากไพ่", newBtn: "ดูดวงใหม่",
        histTitle: "ประวัติการดูดวง", histEmpty: "ยังไม่มีประวัติ เริ่มดูดวงครั้งแรกได้เลยค่ะ",
        histLocked: "ปลดล็อกคำตอบเต็มเพื่อดูข้อความนี้", unlockedTag: "(ยังไม่ปลดล็อก)", questionLabel: "คำถาม",
        grantBtn: "[ทดสอบ] เติม 5 เหรียญ", memberOn: "[ทดสอบ] ยกเลิกสมาชิก", memberOff: "[ทดสอบ] เปิดสมาชิก",
        logoutBtn: "ออกจากระบบ", memberYes: "สมาชิก", memberNo: "ทั่วไป",
        disclaimer: "ไพ่และคำตอบใช้เพื่อความบันเทิงและการสะท้อนความคิดเท่านั้น ไม่ใช่คำแนะนำทางการแพทย์ กฎหมาย หรือการลงทุน",
        toastName: "กรุณากรอกชื่อ", toastTopic: "เลือกหัวข้อหรือพิมพ์คำถามก่อนนะคะ",
        toastWelcome: (n) => `ยินดีต้อนรับ ${n}`, toastLoggedOut: "ออกจากระบบแล้ว",
        toastGranted: "เติมแล้ว 5 เหรียญ", toastMemberOn: "เปิดสมาชิกแล้ว", toastMemberOff: "ยกเลิกสมาชิกแล้ว",
        toastUnlocked: "ปลดล็อกคำตอบเต็มแล้ว",
        toastNoCoins: (c) => `เหรียญไม่พอ ต้องใช้ ${c} เหรียญ ลองกด [เติม 5 เหรียญ] ในหน้าบัญชี`,
        unlockCost: (c) => `อ่านคำตอบฉบับเต็มใช้ ${c} เหรียญ`, unlockBtn: (c) => `ปลดล็อกด้วย ${c} เหรียญ`,
        memberNote: "หรือสมัครสมาชิกเพื่ออ่านไม่อั้น (เปิดให้สมัครเร็ว ๆ นี้)",
        dailyTitle: "ไพ่ประจำวันนี้", dailyBack: "แตะเพื่อเปิดไพ่ประจำวันนี้", dailyLabel: "ไพ่วันนี้",
        dailyDone: "ไพ่ของวันนี้เปิดแล้ว กลับมาดูใหม่พรุ่งนี้ได้เลยค่ะ",
        dailyLoading: "กำลังดูไพ่ของวันนี้...",
        dailyAi: [
          "คุณคือนักพยากรณ์ไพ่ทาโรต์ พูดภาษาไทยอย่างอบอุ่น กระชับ และเป็นธรรมชาติ",
          "จากไพ่ประจำวันใบเดียวที่ให้มา ตอบเป็นสองส่วนเท่านั้น",
          "ส่วนแรกขึ้นต้นด้วย 'โอกาสวันนี้:' อธิบายว่าวันนี้มีโอกาสจะเกิดอะไรขึ้นจากความหมายของไพ่ ส่วนที่สองขึ้นต้นด้วย 'คำเตือนวันนี้:' บอกสิ่งที่ควรระวังหรือหลีกเลี่ยงในวันนี้",
          "ไพ่กลับหัวให้ตีความเป็นด้านที่ติดขัดหรือต้องทบทวน ห้ามให้คำแนะนำทางการแพทย์ กฎหมาย หรือการลงทุนเฉพาะเจาะจง ห้ามใช้ Markdown ความยาวรวมประมาณ 5-8 ประโยค"
        ].join("\n"),

  // ---------- สถานะ (คุยกับเซิร์ฟเวอร์) ----------
  // เวอร์ชันนี้ใช้ภาษาไทยก่อน ภาษาญี่ปุ่นและอังกฤษจะเพิ่มทีหลัง
  const TOKEN_KEY = "tarot-token";
  let lang = "th";
  let token = null, me = null, stats = { readings: 0, dailyDays: 0 };
  let topicIdx = 0, count = 3, session = null, revealed = new Set();
  let daily = null, history = [];

  function loadToken() { try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {} }
  function saveToken(t) {
    token = t;
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  const ui = () => L[lang].ui;
  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  // เรียก API ของเซิร์ฟเวอร์ ถ้า token หมดอายุจะกลับไปหน้าล็อกอิน
  async function api(path, { method = "GET", body } = {}) {
    const res = await fetch(path, {
      method,
      headers: Object.assign({ "content-type": "application/json" }, token ? { authorization: "Bearer " + token } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (res.status === 401 && path !== "/api/login") {
      saveToken(null); me = null; session = null; showScreen(false);
    }
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  function renderUser() {
    if (!me) return;
    $("accName").textContent = me.name;
    $("heroName").textContent = me.name;
    $("heroSub").textContent = "@" + me.name;
    $("stMember").textContent = me.member ? ui().memberYes : ui().memberNo;
    $("stReads").textContent = stats.readings;
    $("stDaily").textContent = stats.dailyDays;
    $("avatarBtn").setAttribute("aria-label", ui().avatarLabel);
    // ระบบเหรียญและปุ่มทดสอบถูกซ่อนไว้ก่อน
    $("stCoins").parentElement.hidden = true;
    $("grantBtn").hidden = true;
    $("memberBtn").hidden = true;
    paintAvatar();
  }

  // ---------- โปรไฟล์ ----------
  // จิ้งจอกเก้าหางลายทอง (รูปที่สร้างจาก Canva ตัดพื้นหลังแล้ว) พร้อมดาวระยิบ
  function foxArt() {
    const sparks = [[16, 30], [184, 24], [188, 100], [10, 118], [168, 60]].map(([x, y], i) =>
      `<path class="spark" style="animation-delay:${(-i * 0.6).toFixed(1)}s" d="M${x} ${y - 5} L${x + 1.4} ${y - 1.4} L${x + 5} ${y} L${x + 1.4} ${y + 1.4} L${x} ${y + 5} L${x - 1.4} ${y + 1.4} L${x - 5} ${y} L${x - 1.4} ${y - 1.4} Z" fill="#e6c574"/>`).join("");
    return `<img alt="" src="fox.png"/>
      <svg viewBox="0 0 200 140" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none" aria-hidden="true">${sparks}</svg>`;
  }
  $("fox").innerHTML = foxArt();
  function paintAvatar() {
    let src = null;
    try { src = localStorage.getItem("tarot-avatar"); } catch (e) {}
    $("avatarImg").src = src || "";
    $("avatarImg").hidden = !src;
    $("avatarPlus").hidden = !!src;
  }
  $("avatarBtn").addEventListener("click", () => $("avatarFile").click());
  $("avatarBtn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("avatarFile").click(); } });
  $("avatarFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f || !f.type.startsWith("image/")) return;
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const S = 160;
        const c = document.createElement("canvas");
        c.width = S; c.height = S;
        const m = Math.min(im.width, im.height);
        c.getContext("2d").drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, S, S);
        try { localStorage.setItem("tarot-avatar", c.toDataURL("image/jpeg", 0.85)); } catch (err) {}
        paintAvatar();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });

  function showScreen(loggedIn) { $("viewLogin").hidden = loggedIn; $("viewMain").hidden = !loggedIn; }

  // ---------- การแสดงผล ----------
  function renderTopics() {
    $("topicChips").innerHTML = L[lang].topics.map((t, i) =>
      `<button class="chip" data-topic="${i}" aria-pressed="${i === topicIdx}">${esc(t)}</button>`).join("");
  }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const v = ui()[el.dataset.i18n];
      if (typeof v === "string") el.textContent = v;
    });
    document.querySelectorAll("[data-i18nph]").forEach((el) => { el.placeholder = ui()[el.dataset.i18nph] || ""; });
    $("drawHint").textContent = ui().drawHint;
    renderTopics();
    renderDaily();
    renderUser();
    if (!$("tabHist").hidden) renderHistory();
  }

  $("topicChips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-topic]"); if (!b) return;
    topicIdx = Number(b.dataset.topic); renderTopics();
  });
  $("countChips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-n]"); if (!b) return;
    count = Number(b.dataset.n);
    document.querySelectorAll("#countChips .chip").forEach((c) => c.setAttribute("aria-pressed", String(Number(c.dataset.n) === count)));
  });

  // ---------- การอ่านไพ่ ----------
  $("startBtn").addEventListener("click", async () => {
    const question = $("question").value.trim();
    if (!question && topicIdx === 0) return toast(ui().toastTopic);
    const btn = $("startBtn");
    btn.disabled = true;
    try {
      const topicLabel = L[lang].topics[topicIdx];
      const r = await api("/api/read", { method: "POST", body: { topic: topicLabel, question, count } });
      if (r.crisis) return showCrisis(r.message);
      if (r.user) me = r.user;
      stats.readings += 1;
      session = { question, topicLabel, count, cards: r.cards, text: r.text, unlocked: r.unlocked };
      revealed = new Set();
      renderUser();

      $("drawCard").hidden = false;
      $("resultCard").hidden = true;
      $("drawHint").textContent = ui().drawHint;
      const row = $("deckRow");
      row.className = "cards" + (count === 5 ? " five" : "");
      row.innerHTML = Array.from({ length: count }, (_, i) =>
        `<button class="slot back" data-i="${i}" aria-label="${esc(ui().cardLabel(i))}"><span class="face">✦</span></button>`).join("");
      $("drawCard").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      toast("เกิดข้อผิดพลาด กรุณาลองใหม่");
    } finally {
      btn.disabled = false;
    }
  });

  $("deckRow").addEventListener("click", (e) => {
    const b = e.target.closest(".slot.back"); if (!b || !session) return;
    const i = Number(b.dataset.i);
    if (revealed.has(i)) return;
    revealed.add(i);
    const c = session.cards[i];
    b.className = "slot open pop" + (c.reversed ? " rev" : "");
    b.disabled = true;
    b.innerHTML = `<span class="face">${c.reversed ? "🔄" : "✨"}</span><span class="nm">${esc(c.name)}</span><span class="nm" style="color:var(--muted)">${esc(c.sub)} · ${c.reversed ? ui().dirRev : ui().dirUp}</span>`;
    if (revealed.size === session.count) {
      $("drawHint").textContent = ui().drawDone;
      setTimeout(showResult, 600);
    } else {
      $("drawHint").textContent = ui().drawProgress(revealed.size, session.count);
    }
  });

  function showResult() {
    const s = session;
    if (!s) return;
    $("resultCard").hidden = false;
    $("crisisBox").hidden = true;
    $("resultCards").className = "cards" + (s.count === 5 ? " five" : "");
    $("resultCards").innerHTML = s.cards.map((c) =>
      `<div class="slot open${c.reversed ? " rev" : ""}"><span class="face">✦</span><span class="nm">${esc(c.name)}</span><span class="nm" style="color:var(--muted)">${esc(c.sub)}</span></div>`).join("");
    $("resultText").textContent = s.text;
    $("lockBox").hidden = true;
    $("followBox").hidden = false;
    $("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function showCrisis(message) {
    session = null;
    $("drawCard").hidden = true;
    $("resultCard").hidden = false;
    $("resultCards").innerHTML = "";
    $("resultText").textContent = "";
    $("lockBox").hidden = true;
    $("followBox").hidden = true;
    $("crisisBox").hidden = false;
    $("crisisBox").textContent = message;
    $("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  $("newBtn").addEventListener("click", () => {
    session = null; revealed = new Set();
    $("question").value = "";
    $("resultCard").hidden = true; $("drawCard").hidden = true; $("crisisBox").hidden = true;
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---------- ไพ่ประจำวัน (เซิร์ฟเวอร์เป็นคนสุ่มและเก็บ) ----------
  async function loadDaily() {
    try {
      const r = await api("/api/daily");
      daily = { card: r.card, text: r.text };
      if (r.user) me = r.user;
    } catch (e) {
      daily = null;
    }
    renderDaily();
  }
  function renderDaily() {
    $("dailyDate").textContent = new Date().toLocaleDateString(lang === "th" ? "th-TH" : "en-US", { year: "numeric", month: "long", day: "numeric" });
    if (!daily) {
      $("dailySlot").innerHTML = `<div class="slot back"><span class="face">✦</span></div>`;
      $("dailyText").textContent = ui().dailyLoading;
      return;
    }
    const c = daily.card;
    $("dailySlot").innerHTML = `<div class="slot open${c.reversed ? " rev" : ""}"><span class="face">${c.reversed ? "🔄" : "✨"}</span><span class="nm">${esc(c.name)}</span><span class="nm" style="color:var(--muted)">${esc(c.sub)}</span></div>`;
    $("dailyText").textContent = daily.text + "\n\n" + ui().dailyDone;
  }

  // ---------- เปิดไพ่ต่อ ----------
  // ใช้ย่อหน้าสุดท้ายของคำตอบ (มักเป็นคำถามปลายเปิด) เป็นคำถามใหม่
  function lastParagraph(text) {
    const paras = text.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    return paras[paras.length - 1] || "";
  }
  $("followYes").addEventListener("click", () => {
    const s = session;
    if (!s || !s.text) return;
    $("question").value = lastParagraph(s.text);
    $("startBtn").click();
  });
  $("followNo").addEventListener("click", () => {
    session = null; revealed = new Set();
    $("question").value = "";
    $("resultCard").hidden = true; $("drawCard").hidden = true; $("followBox").hidden = true;
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("question").focus();
  });

  // ---------- หมวดหลัก ----------
  document.querySelectorAll("[data-cat]").forEach((btn) => btn.addEventListener("click", () => {
    const c = btn.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
    $("catDaily").hidden = c !== "daily";
    $("catQa").hidden = c !== "qa";
  }));

  // ---------- แท็บ ----------
  document.querySelectorAll("[data-tab]").forEach((btn) => btn.addEventListener("click", () => {
    const name = btn.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
    $("tabRead").hidden = name !== "read";
    $("tabHist").hidden = name !== "hist";
    $("tabAcc").hidden = name !== "acc";
    if (name === "hist") loadHistory();
  }));

  async function loadHistory() {
    try {
      const r = await api("/api/history");
      history = r.history || [];
      stats.readings = history.length;
      renderUser();
    } catch (e) {
      history = [];
    }
    renderHistory();
  }
  function renderHistory() {
    const list = history;
    if (!list.length) { $("histList").innerHTML = `<p class="muted">${esc(ui().histEmpty)}</p>`; return; }
    const loc = lang === "th" ? "th-TH" : "en-US";
    $("histList").innerHTML = list.map((h, i) => `
      <div class="hist" data-idx="${i}" tabindex="0" role="button" aria-expanded="false">
        <div class="t">${esc(h.topic)} · ${h.count} ใบ${h.unlocked ? "" : " " + esc(ui().unlockedTag)}</div>
        <div class="d">${new Date(h.createdAt).toLocaleString(loc)}</div>
        <div class="d">${esc(h.cards.join(", "))}</div>
        ${h.question ? `<div class="d">${esc(ui().questionLabel)}: ${esc(h.question)}</div>` : ""}
        <div class="result" hidden>${h.text ? esc(h.text) : esc(ui().histLocked)}</div>
      </div>`).join("");
  }
  $("histList").addEventListener("click", (e) => {
    const h = e.target.closest(".hist"); if (!h) return;
    const r = h.querySelector(".result"); r.hidden = !r.hidden;
    h.setAttribute("aria-expanded", String(!r.hidden));
  });

  // ---------- บัญชีและล็อกอิน ----------
  async function refreshAll() {
    try {
      const m = await api("/api/me");
      me = m.user;
      if (m.stats) stats = m.stats;
    } catch (e) { /* ถ้าโหลดไม่ได้ จะกลับไปหน้าล็อกอินโดย api() */ }
    renderUser();
    loadDaily();
    loadHistory();
  }
  $("loginBtn").addEventListener("click", async () => {
    const username = $("loginName").value.trim();
    const password = $("loginPass").value;
    $("loginError").textContent = "";
    if (!username || !password) { $("loginError").textContent = "กรอกชื่อผู้ใช้และรหัสผ่าน"; return; }
    try {
      const data = await api("/api/login", { method: "POST", body: { username, password } });
      saveToken(data.token);
      me = data.user;
      showScreen(true);
      await refreshAll();
      $("loginPass").value = "";
      toast(ui().toastWelcome(data.user.name));
    } catch (e) {
      $("loginError").textContent = e.message || "เข้าสู่ระบบไม่สำเร็จ";
    }
  });
  $("logoutBtn").addEventListener("click", () => {
    saveToken(null); me = null; session = null; daily = null;
    showScreen(false); toast(ui().toastLoggedOut);
  });

  // ---------- เริ่มต้น ----------
  const langBar = document.querySelector(".lang");
  if (langBar) langBar.hidden = true;
  loadToken();
  applyStatic();
  showScreen(!!token);
  if (token) refreshAll();
})();
</script>
</body>
</html>
